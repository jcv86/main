name: A4 Opportunity Engine

on:
  pull_request:
    paths:
      - 'docs/dtc/DTC_A4_OPPORTUNITY_ENGINE_V1.md'
      - 'docs/dtc/DTC_CHILETRABAJOS_RELIABILITY.md'
      - 'docs/dtc/DTC_MULTISOURCE_OPPORTUNITY_COLLECTOR.md'
      - 'app/despega/a4/job-matching/**'
      - 'lib/opportunities/**'
      - 'app/api/a4/opportunities/**'
      - 'app/api/health/opportunities/**'
      - 'app/api/cron/a4-opportunities/**'
      - 'scripts/check-a4-opportunity-engine.ts'
      - 'scripts/test-chiletrabajos.mjs'
      - 'scripts/test-opportunity-*.mjs'
      - 'scripts/test-employer-*.mjs'
      - 'scripts/smoke-employer-sources.mjs'
      - 'scripts/fixtures/employers/**'
      - 'scripts/fixtures/chiletrabajos/**'
      - 'supabase/migrations/*a4_opportunit*.sql'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vercel.json'
      - '.github/workflows/a4-opportunity-engine.yml'

permissions:
  contents: read

jobs:
  opportunity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Existing opportunity contract
        run: pnpm exec tsx scripts/check-a4-opportunity-engine.ts
      - name: Provider, matching, refresh and route regressions
        run: pnpm run test:a4-opportunities
      - name: Employer sources, catalog and isolated failure regressions
        run: pnpm run test:a4-employers
      - name: TypeScript full-repository check
        run: pnpm exec tsc --noEmit

  opportunity-lease-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dtc_opportunity_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dtc_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dtc_opportunity_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DTC_TEST_DATABASE_URL: postgres://postgres:dtc_ci_only@127.0.0.1:5432/dtc_opportunity_tests
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lease privileges and concurrent execution in isolated PostgreSQL
        run: pnpm run test:a4-opportunity-db
