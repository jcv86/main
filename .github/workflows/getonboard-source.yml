name: Get on Board Source

on:
  pull_request:
    paths:
      - 'lib/opportunities/sources/getonboard.ts'
      - 'lib/opportunities/sources/retry-after.ts'
      - 'lib/opportunities/temporal-filter.ts'
      - 'lib/opportunities/sources/chiletrabajos-parser.ts'
      - 'lib/opportunities/types.ts'
      - 'lib/opportunities/verified-index.ts'
      - 'app/api/a4/opportunities/getonboard/**'
      - 'app/api/health/opportunities/getonboard/**'
      - 'scripts/check-getonboard-source.ts'
      - 'scripts/test-getonboard*.mjs'
      - 'scripts/fixtures/getonboard/**'
      - 'docs/dtc/DTC_GETONBOARD_RELIABILITY.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/getonboard-source.yml'

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Existing source contract
        run: pnpm exec tsx scripts/check-getonboard-source.ts
      - name: Provider and authenticated route regressions
        run: pnpm run test:getonboard
      - name: TypeScript full-repository check
        run: pnpm exec tsc --noEmit
