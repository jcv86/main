name: Dashboard v2 foundation

on:
  pull_request:
    paths:
      - 'app/despega/dashboard/page.tsx'
      - 'components/layout/**'
      - 'components/ui/**'
      - 'lib/journey/**'
      - 'lib/dtc/**'
      - 'scripts/test-dashboard-v2-foundation.mjs'
      - '.github/workflows/dashboard-v2-foundation.yml'

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dashboard contract
        run: node scripts/test-dashboard-v2-foundation.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
