name: A2 Outcome Design

on:
  pull_request:
    paths:
      - 'docs/dtc/DTC_A2_EXECUTION_CAPABILITY_DESIGN.md'
      - 'scripts/check-a2-outcome-design.ts'
      - '.github/workflows/a2-outcome-design.yml'

jobs:
  comparability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/check-a2-outcome-design.ts
