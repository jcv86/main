name: A4 Review UX

on:
  pull_request:
    paths:
      - 'app/despega/a4/**'
      - 'components/a4/strategic-radar-workspace.tsx'
      - 'scripts/check-a4-review-ux.ts'
      - '.github/workflows/a4-review-ux.yml'

jobs:
  a4-review-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/check-a4-review-ux.ts
      - run: pnpm exec tsc --noEmit
