name: Assessment drafts

on:
  pull_request:
    paths:
      - 'app/api/assessments/drafts/**'
      - 'app/despega/conozcamonos-1/**'
      - 'app/despega/a1-cerebral/**'
      - 'lib/assessment-drafts.ts'
      - 'lib/use-assessment-draft.ts'
      - 'supabase/migrations/*assessment_drafts.sql'
      - 'scripts/test-assessment-drafts.mjs'
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:assessment-drafts
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
