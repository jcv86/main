name: A4 Career Identity strategic evidence

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260804160000_a4_career_identity_strategic_evidence.sql'
      - 'scripts/check-a4-career-identity-contract.ts'
      - '.github/workflows/a4-career-identity.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: A4 Career Identity strategic evidence contract
        run: pnpm exec tsx scripts/check-a4-career-identity-contract.ts
      - name: TypeScript full-repository check
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
