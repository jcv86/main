name: Career Identity validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  career-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Career Identity security and audit contract
        run: npx tsx scripts/check-career-identity-foundation-contract.ts

      - name: TypeScript full-repository check
        run: npx tsc --noEmit
