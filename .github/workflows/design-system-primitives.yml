name: Design system primitives

on:
  pull_request:
    paths:
      - 'components/ui/**'
      - 'scripts/test-design-system-primitives.mjs'
      - '.github/workflows/design-system-primitives.yml'

jobs:
  primitives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-design-system-primitives.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
