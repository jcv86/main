name: Production public QA

on:
  pull_request:
    paths:
      - 'app/layout.tsx'
      - 'app/(public)/como-funciona/layout.tsx'
      - 'app/(public)/para-empresas/layout.tsx'
      - 'app/(public)/contact/layout.tsx'
      - 'app/(public)/contact/page.tsx'
      - 'app/convenios-universidades/page.tsx'
      - 'app/faq/page.tsx'
      - 'app/privacy/page.tsx'
      - 'app/terms/page.tsx'
      - 'app/biblioteca/page.tsx'
      - 'app/sitemap.ts'
      - 'app/manifest.ts'
      - 'components/dtc/theme.tsx'
      - 'components/dtc/navbar.tsx'
      - 'components/dtc/closing-canonical.tsx'
      - 'components/seo-optimized-content.tsx'
      - 'lib/faq-data.ts'
      - 'lib/schema-org.tsx'
      - 'public/ai-training-data.md'
      - 'scripts/check-production-public-qa-contract.ts'
      - '.github/workflows/production-public-qa.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Public production credibility contract
        run: pnpm exec tsx scripts/check-production-public-qa-contract.ts
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
