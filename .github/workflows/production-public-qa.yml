name: Production public QA

on:
  pull_request:
    paths:
      - 'components/dtc/theme.tsx'
      - 'app/(public)/como-funciona/layout.tsx'
      - 'lib/schema-org.tsx'
      - 'scripts/check-production-public-qa-contract.ts'
      - '.github/workflows/production-public-qa.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Public production credibility contract
        run: pnpm exec tsx scripts/check-production-public-qa-contract.ts
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
