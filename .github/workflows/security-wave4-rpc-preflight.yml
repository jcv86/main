name: Security Wave 4 RPC preflight

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260915170000_harden_residual_privileged_rpc_surface.sql'
      - 'scripts/security-wave4-rpc-fixture.sql'
      - 'scripts/security-wave4-rpc-verify.sql'
      - '.github/workflows/security-wave4-rpc-preflight.yml'

permissions:
  contents: read

jobs:
  disposable-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start disposable local Supabase database only
        run: |
          export WAVE4_ROOT="$RUNNER_TEMP/dtc-wave4"
          echo "WAVE4_ROOT=$WAVE4_ROOT" >> "$GITHUB_ENV"
          supabase init --workdir "$WAVE4_ROOT" --yes
          supabase start --workdir "$WAVE4_ROOT" -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$WAVE4_ROOT-start.log" 2>&1
          supabase status --workdir "$WAVE4_ROOT" -o json > "$WAVE4_ROOT-status.json"
      - name: Apply residual RPC hardening twice and verify privileges
        run: |
          DB_URL="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.WAVE4_ROOT+'-status.json','utf8')).DB_URL)")"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/security-wave4-rpc-fixture.sql
          for pass in 1 2; do
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260915170000_harden_residual_privileged_rpc_surface.sql
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/security-wave4-rpc-verify.sql
      - name: Stop disposable local stack
        if: always()
        run: supabase stop --workdir "$WAVE4_ROOT" --no-backup > /dev/null 2>&1 || true
