name: Design enforcement

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'scripts/lint-design-system.mjs'
      - 'DESIGN.md'
      - '.github/workflows/design-enforcement.yml'

jobs:
  compliance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate design system compliance
        run: node scripts/lint-design-system.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
