name: Shell page foundation

on:
  pull_request:
    paths:
      - 'components/layout/**'
      - 'app/despega/layout.tsx'
      - 'scripts/test-shell-page-foundation.mjs'
      - '.github/workflows/shell-page-foundation.yml'

jobs:
  page-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shell page foundation contract
        run: node scripts/test-shell-page-foundation.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
