name: A1 browser and local Auth
on:
  push:
    branches:
      - 'uat/dtc-20261106'
  pull_request:
    paths:
      - 'scripts/a1-browser-qa/**'
      - 'components/reports/**'
      - 'components/a1-canonical-report.tsx'
      - 'components/career/**'
      - 'components/journey/**'
      - 'components/a4/**'
      - 'components/outcomes/**'
      - 'components/layout/**'
      - 'components/session-wrapper.tsx'
      - 'components/coach-provider-wrapper.tsx'
      - 'components/coach-strategic-provider.tsx'
      - 'components/analytics/journey-stage-analytics.tsx'
      - 'components/a2-*.tsx'
      - 'components/a3/**'
      - 'contexts/**'
      - 'lib/a1/**'
      - 'lib/a4/**'
      - 'lib/a2/**'
      - 'lib/a3/**'
      - 'lib/a2-*.ts'
      - 'lib/a3-*.ts'
      - 'lib/disc-test-questions.ts'
      - 'lib/middleware/**'
      - 'lib/outcomes/**'
      - 'lib/opportunities/**'
      - 'lib/journey/**'
      - 'lib/reports/**'
      - 'lib/career/**'
      - 'lib/supabase/**'
      - 'lib/observability/**'
      - 'lib/auth/**'
      - 'middleware.ts'
      - 'app/api/a1/**'
      - 'app/api/a1-cerebral-save/**'
      - 'app/api/a4/**'
      - 'app/api/a2/**'
      - 'app/api/a3/**'
      - 'app/api/journey/**'
      - 'app/api/outcomes/**'
      - 'app/api/career/**'
      - 'app/api/auth/invitation/**'
      - 'app/api/gamification/global/**'
      - 'app/api/preferences/**'
      - 'app/api/v1-analytics/**'
      - 'app/despega/a4/**'
      - 'app/despega/layout.tsx'
      - 'app/despega/*-outcome-*/**'
      - 'app/despega/a1-cerebral-intro/**'
      - 'app/despega/a2/**'
      - 'app/despega/a3/**'
      - 'app/despega/recorrido/**'
      - 'app/despega/objetivo-laboral/**'
      - 'app/providers.tsx'
      - 'app/despega/settings/**'
      - 'hooks/use-auth-redirect.ts'
      - 'app/globals.css'
      - 'app/design-system.css'
      - 'supabase/migrations/20260825010000_pilot_access_foundation.sql'
      - 'supabase/migrations/*a4*'
      - 'supabase/migrations/20260915160000_canonical_journey_foundation.sql'
      - 'supabase/migrations/20260915160100_canonical_journey_security.sql'
      - 'supabase/migrations/*outcome*'
      - 'supabase/migrations/20260920173000_career_search_intents.sql'
      - 'supabase/migrations/*labor_objective*'
      - '.github/workflows/a1-browser-qa.yml'
permissions:
  contents: read
concurrency:
  group: a1-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      A1_BROWSER_LAB: 'yes'
      A1_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Initialize runner-local paths
        run: |
          echo "A1_LAB_ROOT=$RUNNER_TEMP/dtc-a1-browser" >> "$GITHUB_ENV"
          echo "A1_TOOLS_ROOT=$RUNNER_TEMP/dtc-a1-tools" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Install application and isolated browser tools
        run: |
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --prefix "$A1_TOOLS_ROOT" --ignore-scripts --no-audit --no-fund playwright@1.56.1 @axe-core/playwright@4.10.2
          "$A1_TOOLS_ROOT/node_modules/.bin/playwright" install chromium
      - name: UAT isolation and returning-login regression
        if: github.ref == 'refs/heads/uat/dtc-20261106'
        run: npm run test:uat-isolation
      - name: UI response observation survives navigation and excludes stale refreshes
        run: node scripts/a1-browser-qa/closure-response-browser.mjs
      - name: Prepare isolated application and start local Supabase only
        run: |
          node scripts/a1-browser-qa/prepare.mjs
          mkdir -p "$A1_LAB_ROOT/app-runtime/app/api/gamification/global"
          cp app/api/gamification/global/route.ts "$A1_LAB_ROOT/app-runtime/app/api/gamification/global/route.ts"
          mkdir -p "$A1_LAB_ROOT/app-runtime/app/api/auth/invitation/claim"
          cp app/api/auth/invitation/claim/route.ts "$A1_LAB_ROOT/app-runtime/app/api/auth/invitation/claim/route.ts"
          node scripts/a1-browser-qa/configure-local.mjs
          supabase init --workdir "$A1_LAB_ROOT/stack" --yes
          supabase start --workdir "$A1_LAB_ROOT/stack" -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$A1_LAB_ROOT/stack-start.log" 2>&1
          supabase status --workdir "$A1_LAB_ROOT/stack" -o json > "$A1_LAB_ROOT/status.json"
      - name: Apply selected real migrations and create synthetic Auth users
        run: |
          npx tsx scripts/a1-browser-qa/seed.ts
          npx tsx scripts/a1-browser-qa/seed-invitation.ts
      - name: Scanner-safe single-use invitation in real browser
        run: node scripts/a1-browser-qa/invitation-browser.mjs
      - name: Preview-equivalent middleware runtime boundaries
        run: node scripts/a1-browser-qa/runtime-boundary-browser.mjs
      - name: Browser, cookies, PostgREST, preferences persistence, mobile and print
        run: node scripts/a1-browser-qa/browser.mjs
      - name: A1-A4 map, persisted progress and navigation in the same local stack
        run: node scripts/a1-browser-qa/flow-browser.mjs
      - name: Browser to API to redacted log request correlation
        run: node scripts/a1-browser-qa/ops-correlation-browser.mjs
      - name: Append actual AppShell, capture pages and canonical local outcome migrations
        run: |
          node scripts/a1-browser-qa/closure-prepare.mjs
          npx tsx scripts/a1-browser-qa/closure-seed.ts
      - name: Six capture pages, real owner RLS, reload continuity and saved objective revision conflicts
        run: node scripts/a1-browser-qa/closure-browser.mjs
      - name: Upload only synthetic visual evidence and sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dtc-a1-browser/evidence
          retention-days: 7
          if-no-files-found: warn
      - name: Stop disposable local stack, never a linked project
        if: always()
        run: |
          if test -f "$A1_LAB_ROOT/stack/supabase/config.toml"; then
            supabase stop --workdir "$A1_LAB_ROOT/stack" --no-backup > /dev/null 2>&1 || true
          fi
